title: Montréal JUG
locale: fr_CA
description: Le Montréal JUG est une association à but non lucratif dont l’objectif est d’organiser des conférences et rencontres gratuites et accessibles dans le domaine du langage de programmation Java. Les conférences sont en français ou en anglais, à la discrétion du présentateur. Le Montréal JUG est aussi l’un des plus gros JUG au monde avec plus de 1500 membres et une audience moyenne de 65 professionnels en informatique à chaque conférence, et une croissance en 2015-2016 de 40 nouveaux membres par mois!
