<head>
{#include partials/head.html /}
</head>

<body id="page">

{#include partials/navigation.html /}

<div id="main" role="main">
  <article class="entry">
    {#if page.data.image.feature??}<img src="{site.url.absolute}images/{page.data.image.feature}" class="entry-feature-image" alt="{page.title.raw}" {#if !cdi:settings.logo??}style="margin-top:0;"{/if}>{#if page.data.image.credit??}<p class="image-credit">Photo Credit: <a href="{page.data.image.creditlink}">{page.data.image.credit}</a>{/if}{/if}
    <div class="entry-wrapper">
      <header class="entry-header">
        <h1 class="entry-title">{page.title.raw}</h1>
      </header>
      <div class="entry-content">
        {#insert /}
      </div><!-- /.entry-content -->
    </div><!-- /.entry-wrapper -->
  </article>
</div><!-- /#main -->

<div class="footer-wrapper">
  <footer role="contentinfo" class="entry-wrapper">
    {#include partials/footer.html /}
  </footer>
</div><!-- /.footer-wrapper -->

{#include partials/scripts.html /}

</body>
</html>
