<meta charset="utf-8">
<title>{#if page.title??}{page.title.raw} &#8211; {/if}{cdi:settings.title}</title>
{#if page.data.excerpt??}<meta name="description" content="{page.data.excerpt.stripHtml}">{/if}
{#if page.data.tags??}<meta name="keywords" content="{#each page.data.tags}{it}{#if it_hasNext}, {/if}{/each}">{/if}

{#if page.data.author??}
{#include partials/open-graph.html author=cdi:authors.get(page.data.author) /}
{#else}
{#include partials/open-graph.html author=cdi:settings.owner /}
{/if}

<link rel="canonical" href="{page.url.absolute}">
<link href="{site.url.absolute}feed.xml" type="application/atom+xml" rel="alternate" title="{cdi:settings.title} Feed">

<!-- https://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- For all browsers -->
{#bundle /}

<meta http-equiv="cleartype" content="on">

<!-- HTML5 Shiv and Media Query Support -->
<!--[if lt IE 9]>
  <script src="{site.url.absolute}assets/js/vendor/html5shiv.min.js"></script>
  <script src="{site.url.absolute}assets/js/vendor/respond.min.js"></script>
<![endif]-->

<!-- JavaScript is enabled: the CSS styles `.no-js` for when it is not -->
<script>document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/, 'js');</script>
