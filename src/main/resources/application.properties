# Roq site configuration (was _config.yml for Jekyll)
# Site-wide values (title, owner, social links...) live in data/settings.yml
site.url=https://www.montreal-jug.org
%dev.site.url=http://localhost:8080
# Jekyll had `future: true`
site.future=true

# Jekyll `_posts/<category>/` -> one Roq collection per category.
# `:Name` keeps the original file-name case, matching Jekyll's `/:categories/:title/`
site.collections.posts=false
site.collections.meetup=true
site.collections.meetup.layout=post
site.collections.meetup.future=true
site.collections.meetup.link=/:collection/:Name/
site.collections.blog=true
site.collections.blog.layout=post
site.collections.blog.future=true
site.collections.blog.link=/:collection/:Name/

# Posts are plain Markdown/HTML: don't interpret `{...}` as Qute expressions
site.escaped-pages=meetup/2*,blog/2*

# Not published by Jekyll either (no date prefix / attachment)
site.ignored-files=meetup/TBD-*,meetup/*.pdf

# Jekyll pages were served at `/<dir>/` with no slug rewriting of static files
site.slugify-files=false

# Jekyll front matter dates are ISO 8601, e.g. 2026-10-15T17:30:00-04:00
site.date-format=yyyy-MM-dd['T'HH:mm[:ss][XXX]]

# Jekyll rendered English dates ("%B %d, %Y")
quarkus.default-locale=en
