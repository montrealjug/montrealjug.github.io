# Builds the Roq (Quarkus) site and deploys it to GitHub Pages
name: Deploy Roq site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
  # Builds (without deploying) pull requests, to catch template/content errors early
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Roq site
        # Sets up the JDK, runs `./mvnw package quarkus:run` with the Roq generator, uploads target/roq
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          java-version: '25'
          site-url: https://www.montreal-jug.org/
          github-pages: ${{ github.event_name != 'pull_request' }}

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
